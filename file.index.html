<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Street Hockey Hype</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap');

        body {
            background-color: #ffffff;
            color: #0c4a6e;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            user-select: none;
            z-index: 0;
            animation: float 5s linear infinite;
            opacity: 0;
        }

        @keyframes float {
            0% { transform: translateY(105vh) scale(1); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-15vh) scale(1.2); opacity: 0; }
        }

        .scoreboard {
            position: relative;
            z-index: 1;
            border: 2px solid #0ea5e9; 
            padding: 40px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 10px 40px rgba(14, 165, 233, 0.15);
            max-width: 600px;
            width: 85%;
            border-radius: 24px;
        }

        h1 {
            font-size: 2.2rem;
            color: #0ea5e9; 
            text-transform: uppercase;
            margin-bottom: 5px;
            letter-spacing: 3px;
            font-weight: 900;
        }

        .subtext {
            font-size: 1.4rem;
            color: #38bdf8; 
            margin-bottom: 30px;
            font-style: italic;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            gap: 15px;
            border-top: 1px solid #e2e8f0;
            padding-top: 25px;
        }

        .stat-box { flex: 1; }

        .label {
            font-size: 0.65rem;
            display: block;
            margin-bottom: 8px;
            color: #64748b; 
            min-height: 45px;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.2;
        }

        .number {
            font-size: 2rem;
            display: block;
            color: #0284c7; 
            font-weight: bold;
        }

        .btn {
            margin-top: 30px;
            padding: 14px 30px;
            background: #0ea5e9;
            color: white;
            border: none;
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.3s ease;
        }

        .btn:hover { background: #0284c7; transform: translateY(-2px); }

        .fan-text {
            margin-top: 25px;
            font-family: 'Permanent Marker', cursive;
            color: #f43f5e; 
            font-size: 1.1rem;
            transform: rotate(-2deg);
        }

        /* Overlay for your specific picture */
        #hypeOverlay {
            position: fixed;
            display: none;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background-color: rgba(255,255,255,0.95);
            z-index: 10;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            cursor: pointer;
        }

        #hypeOverlay img {
            max-width: 90%;
            max-height: 80%;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0,0,0,0.1);
        }

        #overlayHashtag {
            font-family: 'Permanent Marker', cursive;
            color: #0ea5e9;
            font-size: 2rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="scoreboard">
        <h1>GAME DAY VIBES</h1>
        <div class="subtext">hüt gönder locoooo</div>
        
        <div class="stats">
            <div class="stat-box">
                <span class="label">SKILL</span>
                <span class="number">3%</span>
            </div>
            <div class="stat-box">
                <span class="label">LUCK</span>
                <span class="number">67%</span>
            </div>
            <div class="stat-box">
                <span class="label">chance das eine vo üch<br>drü es goal schüsst</span>
                <span class="number">slim</span>
            </div>
        </div>

        <button class="btn" onclick="showImage()">Click for pre-game hype</button>

        <div class="fan-text">
            #fankurveischume <br> & refill & co. auf die eins
        </div>
    </div>

    <div id="hypeOverlay" onclick="hideImage()">
        <div id="overlayHashtag">#heatedrivelryincoming</div>
        <img src="https://i.imgur.com/se56Ut5.jpeg" alt="Team Picture">
        <p style="color: #64748b; margin-top: 15px;">(Click to close)</p>
    </div>

    <script>
        function showImage() { document.getElementById("hypeOverlay").style.display = "flex"; }
        function hideImage() { document.getElementById("hypeOverlay").style.display = "none"; }

        const blueTones = ['#0ea5e9', '#38bdf8', '#0284c7', '#0c4a6e', '#7dd3fc'];
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '💙';
            const size = Math.floor(Math.random() * 25) + 15; 
            heart.style.fontSize = size + 'px';
            heart.style.color = blueTones[Math.floor(Math.random() * blueTones.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 5000);
        }
        setInterval(createHeart, 400);
    </script>

</body>
</html>
